name: Verificar o projeto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    name: Testes e revisão dos arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparar o Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Executar os testes
        run: python -m unittest discover -s testes -v
      - name: Conferir os arquivos de publicação
        run: python ferramentas/higiene_publicacao.py
